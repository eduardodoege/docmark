[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docmark"
version = "0.1.0"
description = "Convert hosted documentation sites to local Markdown — built for feeding LLMs and AI Skills."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Eduardo Doege", email = "eduardodoege87@gmail.com" }]
keywords = ["markdown", "documentation", "crawler", "mintlify", "llm", "ai", "skills", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Documentation",
    "Topic :: Utilities",
]
dependencies = [
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/eduardodoege/docmark"
Repository = "https://github.com/eduardodoege/docmark"
Issues = "https://github.com/eduardodoege/docmark/issues"

[project.scripts]
docmark = "docmark.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/docmark"]
